name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v9
        with:
          version: "0.11.13"
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --extra dev --frozen
      - run: uv run pytest -m "not slow"
      - run: uv run ruff check .
