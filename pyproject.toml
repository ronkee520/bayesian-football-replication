[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bayesian-football-replication"
version = "0.1.0"
description = "Reproducible Bayesian hierarchical models for Premier League scores and results."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "ronkee520" }]
dependencies = [
  "arviz>=0.18,<1",
  "jax>=0.4.30,<1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "numpyro>=0.15,<1",
  "pandas>=2.1,<3",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
]

[project.scripts]
bayes-football-validate = "bayes_football.cli:validate_main"
bayes-football-fit = "bayes_football.cli:fit_main"
bayes-football-report = "bayes_football.reporting:report_main"

[tool.hatch.build.targets.wheel]
packages = ["src/bayes_football"]

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]
markers = [
  "slow: tests that run MCMC and are excluded from the default smoke suite",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
